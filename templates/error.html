{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} | Second Luxe{% endblock %}
{% block meta_description %}{{ message }}{% endblock %}
{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="container">
  <div class="error-page">
    <p class="error-code" aria-hidden="true">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="cluster" style="justify-content:center">
      <a class="btn btn-primary" href="/">Ke beranda</a>
      <a class="btn btn-outline" href="/katalog">Lihat koleksi</a>
    </div>
  </div>
</div>
{% endblock %}
