{% extends "admin/base.html" %}{% block title %}Pengguna — Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><p class="eyebrow">Pengguna</p><h1>Kelola Pengguna</h1></div></div><section class="admin-card"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Pengguna</th><th>Telepon</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>{% for u in rows %}<tr><td><b>{{ u.name }}</b><small>{{ u.email }}</small></td><td>{{ u.phone or '-' }}</td><td><form method="post" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="user_id" value="{{ u.id }}"><input type="hidden" name="action" value="role"><select name="role" onchange="this.form.submit()"><option value="customer" {% if u.role=='customer' %}selected{% endif %}>Customer</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>Admin</option></select></form></td><td>{{ 'Aktif' if u.is_active else 'Nonaktif' }}</td><td><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="user_id" value="{{ u.id }}"><input type="hidden" name="action" value="toggle"><button class="btn btn-sm btn-outline">{{ 'Nonaktifkan' if u.is_active else 'Aktifkan' }}</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
