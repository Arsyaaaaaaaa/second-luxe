{% extends "admin/base.html" %}
{% block title %}Edit Produk — Admin{% endblock %}
{% block admin_content %}
<div class="admin-head"><div><p class="eyebrow">Katalog</p><h1>Edit Produk</h1><p class="muted">{{ p.name }}</p></div><a class="btn btn-outline" href="/produk/{{ p.slug }}">Lihat produk</a></div>
<section class="admin-card"><form method="post" enctype="multipart/form-data" class="admin-form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="field"><label>Nama</label><input name="name" value="{{ p.name }}" required></div><div class="field"><label>Brand</label><select name="brand_id">{% for b in brands %}<option value="{{ b.id }}" {% if b.id==p.brand_id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div><div class="field"><label>Kategori</label><select name="category_id">{% for c in categories %}<option value="{{ c.id }}" {% if c.id==p.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="field"><label>Gender</label><select name="gender">{% for x in ['unisex','wanita','pria'] %}<option value="{{ x }}" {% if p.gender==x %}selected{% endif %}>{{ x|capitalize }}</option>{% endfor %}</select></div>
<div class="field"><label>Ukuran</label><input name="size" value="{{ p.size or '' }}"></div><div class="field"><label>Warna</label><input name="color" value="{{ p.color or '' }}"></div><div class="field"><label>Bahan</label><input name="material" value="{{ p.material or '' }}"></div><div class="field"><label>Kondisi</label><input type="number" name="condition_score" min="1" max="10" value="{{ p.condition_score }}"></div>
<div class="field"><label>Harga</label><input name="price" value="{{ p.price }}"></div><div class="field"><label>Harga asli</label><input name="original_price" value="{{ p.original_price or '' }}"></div><div class="field"><label>Stok</label><input type="number" name="stock" min="0" value="{{ p.stock }}"></div><div class="field"><label>Status</label><select name="status">{% for x in ['available','held','sold'] %}<option value="{{ x }}" {% if p.status==x %}selected{% endif %}>{{ x|capitalize }}</option>{% endfor %}</select></div>
<div class="field full"><label>Deskripsi</label><textarea name="description">{{ p.description or '' }}</textarea></div><div class="field"><label>Catatan kondisi</label><textarea name="condition_notes">{{ p.condition_notes or '' }}</textarea></div><div class="field"><label>Minus/cacat</label><textarea name="flaws">{{ p.flaws or '' }}</textarea></div><div class="field"><label>Kelengkapan</label><input name="completeness" value="{{ p.completeness or '' }}"></div>
<div class="field full"><label>Tambah foto</label><input type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple></div><label class="check"><input type="checkbox" name="is_featured" {% if p.is_featured %}checked{% endif %}> Produk unggulan</label><div class="full"><button class="btn btn-primary">Simpan Perubahan</button></div></form></section>
<section class="admin-card"><h2>Foto produk</h2><div class="admin-images">{% for im in images %}<div class="admin-image"><img src="{{ im.url }}"><div>{% if im.is_primary %}<span class="badge badge-sale">Utama</span>{% else %}<form method="post" action="/admin/produk/{{ p.id }}/foto/{{ im.id }}/utama"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline">Jadikan utama</button></form>{% endif %}<form method="post" action="/admin/produk/{{ p.id }}/foto/{{ im.id }}/hapus"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-danger" onclick="return confirm('Hapus foto ini?')">Hapus</button></form></div></div>{% endfor %}</div></section>
<section class="admin-card danger-zone"><h2>Zona berbahaya</h2><form method="post" action="/admin/produk/{{ p.id }}/hapus"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-danger" onclick="return confirm('Hapus produk ini?')">Hapus Produk</button></form></section>
{% endblock %}
