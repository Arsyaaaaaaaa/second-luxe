{# Komponen kecil: bintang rating #}
{% macro stars(n, size=16) -%}
<span class="stars" role="img" aria-label="{{ n }} dari 5 bintang">
  {%- for i in range(1, 6) -%}
  <svg class="{{ '' if i <= (n|round|int) else 'off' }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.7 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3 1.2-6.2L3 9.5l6.3-.8L12 3z"/></svg>
  {%- endfor -%}
</span>
{%- endmacro %}
